<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <circle cx="200" cy="200" r="180" fill="#EAF6F6"/>
  <circle cx="200" cy="205" r="135" fill="#CFE8E5"/>

  <!-- single lung, larger and centered, with lobe divisions -->
  <path d="M200 110 C155 110 120 150 116 205 C112 258 140 300 185 305
           C205 307 210 280 208 250 C207 230 210 215 200 200
           C210 185 207 165 205 145 C204 128 202 116 200 110 Z" fill="#16324F"/>

  <!-- lobe division lines -->
  <path d="M130 190 L200 200" stroke="#EAF6F6" stroke-width="4" stroke-linecap="round"/>
  <path d="M126 240 L205 250" stroke="#EAF6F6" stroke-width="4" stroke-linecap="round"/>

  <!-- upper lobe = the one being removed, highlighted coral with dashed outline -->
  <path d="M200 110 C170 110 145 130 132 158 C145 168 175 180 205 145
           C204 128 202 116 200 110 Z" fill="#FF8A65"/>
  <path d="M132 158 C145 130 170 110 200 110" fill="none" stroke="#FF8A65" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- camera scope entering from the side -->
  <path d="M260 195 L310 175" stroke="#2B7A78" stroke-width="5" stroke-linecap="round"/>
  <rect x="308" y="163" width="26" height="16" rx="4" fill="#2B7A78" transform="rotate(-20 321 171)"/>
